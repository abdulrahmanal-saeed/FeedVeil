name: Publish signed FeedVeil APK for Obtainium

on:
  push:
    branches:
      - main
      - phase-1/detection
      - phase-3/experimental-autoskip
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/obtainium-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedveil-dev-obtainium-release
  cancel-in-progress: false

jobs:
  check-signing:
    name: Check permanent signing setup
    runs-on: ubuntu-latest
    outputs:
      signing_ready: ${{ steps.check.outputs.signing_ready }}
    steps:
      - id: check
        name: Verify required GitHub secrets are configured
        env:
          STORE_B64: ${{ secrets.FEEDVEIL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FEEDVEIL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FEEDVEIL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FEEDVEIL_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$STORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing credentials configured; publication enabled."
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed Obtainium publishing is skipped until four permanent signing secrets are configured. See docs/OBTAINIUM_UPDATES.md."
          fi

  publish:
    name: Test, sign and publish APK release
    needs: check-signing
    if: needs.check-signing.outputs.signing_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      FEEDVEIL_KEYSTORE_BASE64: ${{ secrets.FEEDVEIL_KEYSTORE_BASE64 }}
      FEEDVEIL_KEYSTORE_PASSWORD: ${{ secrets.FEEDVEIL_KEYSTORE_PASSWORD }}
      FEEDVEIL_KEY_ALIAS: ${{ secrets.FEEDVEIL_KEY_ALIAS }}
      FEEDVEIL_KEY_PASSWORD: ${{ secrets.FEEDVEIL_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android Platform 36 and signing tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key without revealing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feedveil-signing"
          chmod 700 "$RUNNER_TEMP/feedveil-signing"
          printf '%s' "$FEEDVEIL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/feedveil-signing/feedveil.jks"
          chmod 600 "$RUNNER_TEMP/feedveil-signing/feedveil.jks"
          echo "FEEDVEIL_KEYSTORE_FILE=$RUNNER_TEMP/feedveil-signing/feedveil.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/feedveil-signing/feedveil.jks" -storepass:env FEEDVEIL_KEYSTORE_PASSWORD -alias "$FEEDVEIL_KEY_ALIAS" >/dev/null

      - name: Generate increasing dev version
        shell: bash
        run: |
          CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "FEEDVEIL_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "FEEDVEIL_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "FEEDVEIL_RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "FEEDVEIL_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compile, unit-test, lint and build signed release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -PfeedveilVersionCode="$FEEDVEIL_VERSION_CODE" \
            -PfeedveilVersionName="$FEEDVEIL_VERSION_NAME" \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify APK signature and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FeedVeil.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/FeedVeil.apk
          # Same permanent certificate shown by Obtainium for installed v0.1.4.
          # Never publish an APK with a different signing identity under the same package ID.
          CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/FeedVeil.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256="0baf297c85f03d91a367415342b6d7aad75b48d7a83cfd34fe0ee661ff8339ee"
          if [[ "$CERT_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::APK signing certificate differs from installed Obtainium version v0.1.4; refusing publication."
            exit 1
          fi
          echo "Release certificate matches previously installed Obtainium version."
          (cd dist && sha256sum FeedVeil.apk > FeedVeil.apk.sha256)
          cat > dist/RELEASE_NOTES.md <<EOF
          FeedVeil development preview v${FEEDVEIL_RELEASE_VERSION}

          Source commit: ${GITHUB_SHA}
          Android versionCode: ${FEEDVEIL_VERSION_CODE}
          Android versionName: ${FEEDVEIL_VERSION_NAME}

          Experimental development preview: detection accuracy is not guaranteed.
          Do not enable automatic ad actions without applicable test gates.
          The APK is signed with the owner's permanent development signing identity.
          EOF
          if [[ "$GITHUB_REF_NAME" == "phase-3/experimental-autoskip" ]]; then
            echo "" >> dist/RELEASE_NOTES.md
            echo "General Feed + Reels experimental Auto Skip (OFF by default): no fixed skip count, 15-second cooldown, STOP and app-exit safeguards." >> dist/RELEASE_NOTES.md
            echo "Risk: normal posts may be skipped. Floating STOP and approximate Back do not guarantee restoration." >> dist/RELEASE_NOTES.md
            echo "Not a validated ad classifier, not a production-ready release. Do not use unattended." >> dist/RELEASE_NOTES.md
          fi

      - name: Publish one APK in GitHub development prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$FEEDVEIL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite an existing signed APK/version."
            exit 1
          fi
          gh release create "$FEEDVEIL_RELEASE_TAG" \
            dist/FeedVeil.apk dist/FeedVeil.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${FEEDVEIL_RELEASE_VERSION} (FeedVeil Dev)" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/feedveil-signing"
